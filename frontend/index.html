<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07050B" />
    <meta
      name="description"
      content="RIFF — Adaptive Neuro-Learning Engine. Notices when the current way of learning isn't working, and changes how it teaches in real time."
    />
    <title>RIFF — Adaptive Neuro-Learning Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS with custom Fluxora/Riff dark palette configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              display: ['"Inter Tight"', 'Inter', 'sans-serif'],
              serif: ['"Instrument Serif"', 'Georgia', 'serif'],
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              riffBg: '#07050B',
              riffBgSecondary: '#0D0912',
              riffBgTertiary: '#120A18',
              riffAccent: '#7C3AED',
              riffAccentHover: '#9F67FF',
              riffAccentLight: '#C084FC',
              riffCyan: '#47BFFF',
              riffGlass: 'rgba(255, 255, 255, 0.06)',
              riffGlassHeavy: 'rgba(255, 255, 255, 0.09)',
              riffBorder: 'rgba(255, 255, 255, 0.12)',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#07050B] text-white selection:bg-[#7C3AED]/30 selection:text-white overflow-x-hidden antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
