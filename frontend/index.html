<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta
      name="description"
      content="RIFF — Adaptive Neuro-Learning Engine. Noticing when your current learning approach isn't working, and changing how it teaches in real time."
    />
    <title>RIFF — Adaptive Neuro-Learning Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Lexend:wght@400;500;600&family=Playfair+Display:ital,wght@0,400..800;1,400..800&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS with custom dark palette configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Playfair Display"', 'Fraunces', 'Georgia', 'serif'],
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              riffDark: '#050505',
              riffDarkSecondary: '#0A0A0C',
              riffSurface: 'rgba(255, 255, 255, 0.04)',
              riffSurfaceHover: 'rgba(255, 255, 255, 0.08)',
              riffBorder: 'rgba(255, 255, 255, 0.1)',
              riffBorderHover: 'rgba(255, 255, 255, 0.2)',
              riffViolet: '#6366f1',
              riffEmerald: '#10b981',
              riffRose: '#f43f5e',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#050505] text-white selection:bg-indigo-500/30 selection:text-white overflow-x-hidden antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

</html>
